[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-agents"
version = "0.1.0"
description = "Google ADK agents for reproducible quantitative research experiments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "google-adk==2.14.1",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "pydantic>=2.12,<3",
  "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[project.scripts]
quant-agents = "quant_research_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quant_research_agents = ["knowledge/*.json", "_vendor/LICENSE", "_vendor/ORIGIN.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["src/quant_research_agents/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
