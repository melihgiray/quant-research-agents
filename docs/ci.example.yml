# To enable, copy this file to .github/workflows/ci.yml.
name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quant
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: quant_agents_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quant -d quant_agents_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://quant:ci-only@localhost:5432/quant_agents_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -c requirements-tested.txt -e ".[dev,postgres]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: quant-agents demo
